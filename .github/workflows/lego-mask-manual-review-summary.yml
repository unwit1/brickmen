name: LEGO Mask Manual Review Summary

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lego-mask-manual-review-summary.yml'
      - 'tools/knowledge/summarize_mask_manual_reviews.py'
      - 'knowledge/libraries/lego-minifigure-customs/data/review-decisions/mask-headgear-route-review-*.json'
      - 'knowledge/libraries/lego-minifigure-customs/data/bulk-ingestion/mask-headgear-ranked-review-top1000-latest.jsonl'

permissions:
  contents: write

concurrency:
  group: lego-mask-manual-review-summary-main
  cancel-in-progress: true

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Brickmen
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile manual mask-route coverage
        shell: bash
        run: |
          set -euo pipefail
          data=knowledge/libraries/lego-minifigure-customs/data
          bulk="$data/bulk-ingestion"
          python tools/knowledge/summarize_mask_manual_reviews.py \
            --ranked "$bulk/mask-headgear-ranked-review-top1000-latest.jsonl" \
            --decisions-dir "$data/review-decisions" \
            --summary "$bulk/mask-route-manual-review-summary-latest.json" \
            --unreviewed-output "$bulk/mask-route-manual-review-unreviewed-latest.jsonl"

      - name: Commit manual review coverage
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "brickmen-ingestion-bot"
          git config user.email "brickmen-ingestion-bot@users.noreply.github.com"
          git add \
            knowledge/libraries/lego-minifigure-customs/data/bulk-ingestion/mask-route-manual-review-summary-latest.json \
            knowledge/libraries/lego-minifigure-customs/data/bulk-ingestion/mask-route-manual-review-unreviewed-latest.jsonl
          if git diff --cached --quiet; then
            echo "No manual mask-route review changes."
            exit 0
          fi
          git commit -m "knowledge: refresh manual mask route coverage"
          for attempt in 1 2 3 4; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
