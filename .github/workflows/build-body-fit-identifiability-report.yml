name: Build body fit identifiability report

on:
  push:
    paths:
      - ".github/workflows/build-body-fit-identifiability-report.yml"
      - "tools/geometry/analyze_body_fit_identifiability.py"
      - "tools/geometry/analyze_body_fit_identifiability_batch.py"
      - "tools/geometry/compare_body_fit_parameterizations.py"
      - "tools/geometry/generate_body_skeleton.py"
      - "knowledge/libraries/lego-minifigure-customs/data/skeletons/**"
      - "knowledge/libraries/lego-minifigure-customs/data/reference-landmarks/manifest.json"
      - "knowledge/libraries/lego-minifigure-customs/data/reference-landmarks/*-front.json"
  workflow_dispatch:

concurrency:
  group: brickmen-generated-data-writers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Analyze seed parameter identifiability
        run: |
          set -euo pipefail
          python -m tools.geometry.analyze_body_fit_identifiability_batch \
            knowledge/libraries/lego-minifigure-customs/data/reference-landmarks/manifest.json \
            -o knowledge/libraries/lego-minifigure-customs/data/reference-landmarks/seed-identifiability-report.json

          python -m tools.geometry.compare_body_fit_parameterizations \
            knowledge/libraries/lego-minifigure-customs/data/reference-landmarks/manifest.json \
            -o knowledge/libraries/lego-minifigure-customs/data/reference-landmarks/seed-parameterization-comparison.json

      - name: Validate report structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("knowledge/libraries/lego-minifigure-customs/data/reference-landmarks/seed-identifiability-report.json")
          data = json.loads(path.read_text())
          comparison_path = Path("knowledge/libraries/lego-minifigure-customs/data/reference-landmarks/seed-parameterization-comparison.json")
          comparison = json.loads(comparison_path.read_text())
          assert data["production_geometry_authority"] is False
          assert comparison["production_geometry_authority"] is False
          assert len(data["records"]) == 5
          assert len(comparison["records"]) == 5
          assert all(item["expanded_not_worse"] for item in comparison["records"])
          for record in data["records"]:
              assert set(record["analyses"]) == {
                  "current",
                  "safe_expanded_v1",
                  "segmented_torso_experiment",
              }
              for analysis in record["analyses"].values():
                  assert analysis["jacobian_rank"] <= analysis["parameter_count"]
          print("identifiability report validated")
          PY

      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name "brickmen-fit-analysis-bot"
          git config user.email "130810487+unwit1@users.noreply.github.com"
          git add knowledge/libraries/lego-minifigure-customs/data/reference-landmarks/seed-identifiability-report.json knowledge/libraries/lego-minifigure-customs/data/reference-landmarks/seed-parameterization-comparison.json
          if git diff --cached --quiet; then
            echo "No report changes."
            exit 0
          fi
          git commit -m "data: update seed body fit analysis reports"
          git pull --rebase origin main
          git push origin HEAD:main
