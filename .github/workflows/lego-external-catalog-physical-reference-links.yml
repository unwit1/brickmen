name: LEGO External Catalog Physical Reference Links

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lego-external-catalog-physical-reference-links.yml'
      - 'tools/knowledge/build_external_catalog_physical_reference_links.py'
      - 'knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation/official-wishlist-bricklink-metadata-latest.jsonl'

permissions:
  contents: write
concurrency:
  group: lego-external-catalog-physical-reference-links-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          git fetch origin main
          git reset --hard origin/main
      - run: |
          set -euo pipefail
          out=/tmp/physical-reference-links
          mkdir -p "$out"
          python tools/knowledge/build_external_catalog_physical_reference_links.py \
            --input knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation/official-wishlist-bricklink-metadata-latest.jsonl \
            --output "$out/records.jsonl" \
            --summary "$out/summary.json"
          dest=knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation
          cp "$out/records.jsonl" "$dest/external-catalog-physical-reference-links-latest.jsonl"
          cp "$out/summary.json" "$dest/external-catalog-physical-reference-links-summary-latest.json"
      - run: |
          set -euo pipefail
          git config user.name "brickmen-ingestion-bot"
          git config user.email "brickmen-ingestion-bot@users.noreply.github.com"
          git add knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation/external-catalog-physical-reference-links-*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "knowledge: promote external catalog physical reference links"
          git push origin HEAD:main
