name: Generate Body Architecture Challenge Sanitization Candidate

# Retained only as a manual historical/debug workflow.
# The active challenge cohort now uses clean hp236 instead of the leaking col379
# source, so normal pushes must not regenerate obsolete col379 derivatives.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-active-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Explain current state
        run: |
          echo "No active challenge sanitization candidate exists."
          echo "challenge_centaur_col379 was superseded by clean, byte-verified challenge_centaur_hp236."
          echo "See body-architecture-recognition-challenge-sanitization-candidates-v1.json."
