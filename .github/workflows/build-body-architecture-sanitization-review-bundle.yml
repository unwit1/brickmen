name: Build Body Architecture Sanitization Review Bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-body-architecture-sanitization-review-bundle.yml'
      - 'tools/knowledge/prepare_body_architecture_sanitization_review.py'
      - 'tools/knowledge/generate_body_architecture_sanitization_candidates.py'
      - 'tools/knowledge/build_body_architecture_sanitization_review_ui.py'
      - 'knowledge/libraries/lego-minifigure-customs/data/body-architecture-benchmark-sanitization-queue.json'
      - 'knowledge/libraries/lego-minifigure-customs/data/body-architecture-benchmark-sanitization-transforms.json'
      - 'knowledge/libraries/lego-minifigure-customs/data/body-architecture-benchmark-sanitization-candidates.json'

permissions:
  contents: read

jobs:
  build-review-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Brickmen
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependency
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build hash-verified local review bundle
        run: |
          python tools/knowledge/prepare_body_architecture_sanitization_review.py \
            --output-dir .agent-local/body-architecture-sanitization-review \
            --timeout-seconds 30 \
            --delay-seconds 0.10

      - name: Upload transient review bundle
        uses: actions/upload-artifact@v4
        with:
          name: body-architecture-sanitization-review-bundle
          path: .agent-local/body-architecture-sanitization-review
          if-no-files-found: error
          retention-days: 7
