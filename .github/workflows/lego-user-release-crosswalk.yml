name: LEGO User Release Catalog Crosswalk

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lego-user-release-crosswalk.yml'
      - 'tools/knowledge/crosswalk_user_releases_herobloks.py'
      - 'tools/knowledge/snapshot_herobloks_catalog.py'
      - 'tools/knowledge/snapshot_downtheblocks_xinh_catalog.py'
      - 'tools/knowledge/snapshot_downtheblocks_serial_catalog.py'
      - 'knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation/figure-release-candidates-latest.jsonl'

permissions:
  contents: write

concurrency:
  group: lego-user-release-crosswalk-main
  cancel-in-progress: true

jobs:
  crosswalk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Brickmen
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot HeroBloks and exact-crosswalk releases
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/user-release-crosswalk
          mkdir -p "$work"
          python tools/knowledge/snapshot_herobloks_catalog.py \
            --output "$work/herobloks.jsonl" \
            --summary "$work/herobloks-summary.json" \
            --brand-output "$work/herobloks-brands.json"
          python tools/knowledge/snapshot_downtheblocks_xinh_catalog.py \
            --output "$work/downtheblocks-xinh.jsonl" \
            --summary "$work/downtheblocks-xinh-summary.json"
          python tools/knowledge/snapshot_downtheblocks_serial_catalog.py \
            --source-url "https://downtheblocks.com/koruit-minifigure-set-list-database/" \
            --catalog-id "downtheblocks_koruit_kdl" --brand-label "Koruit / KDL" --prefix-regex "XP|K" \
            --output "$work/downtheblocks-koruit-kdl.jsonl" --summary "$work/downtheblocks-koruit-kdl-summary.json"
          python tools/knowledge/snapshot_downtheblocks_serial_catalog.py \
            --source-url "https://downtheblocks.com/kopf-minifigure-set-list-database/" \
            --catalog-id "downtheblocks_kopf_chengyi" --brand-label "Kopf / Chengyi / DA" --prefix-regex "KF|CY|DA" \
            --output "$work/downtheblocks-kopf.jsonl" --summary "$work/downtheblocks-kopf-summary.json"
          python tools/knowledge/snapshot_downtheblocks_serial_catalog.py \
            --source-url "https://downtheblocks.com/pogo-minifigure-set-list-database/" \
            --catalog-id "downtheblocks_pogo" --brand-label "POGO" --prefix-regex "PG" \
            --output "$work/downtheblocks-pogo.jsonl" --summary "$work/downtheblocks-pogo-summary.json"
          python tools/knowledge/snapshot_downtheblocks_serial_catalog.py \
            --source-url "https://downtheblocks.com/wm-minifigure-set-list-database/" \
            --catalog-id "downtheblocks_wm_mg" --brand-label "World Minifigures / MG" --prefix-regex "WM|MG" \
            --output "$work/downtheblocks-wm.jsonl" --summary "$work/downtheblocks-wm-summary.json"
          python tools/knowledge/crosswalk_user_releases_herobloks.py \
            --release-candidates knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation/figure-release-candidates-latest.jsonl \
            --herobloks-catalog "$work/herobloks.jsonl" \
            --historical-xinh-catalog "$work/downtheblocks-xinh.jsonl" \
            --fallback-catalog "downtheblocks_koruit_kdl=$work/downtheblocks-koruit-kdl.jsonl" \
            --fallback-catalog "downtheblocks_kopf_chengyi=$work/downtheblocks-kopf.jsonl" \
            --fallback-catalog "downtheblocks_pogo=$work/downtheblocks-pogo.jsonl" \
            --fallback-catalog "downtheblocks_wm_mg=$work/downtheblocks-wm.jsonl" \
            --output "$work/crosswalk.jsonl" \
            --summary "$work/summary.json" \
            --unresolved-output "$work/unresolved.jsonl" \
            --collision-output "$work/collisions.jsonl"
          dest=knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation
          bulk=knowledge/libraries/lego-minifigure-customs/data/bulk-ingestion
          cp "$work/summary.json" "$dest/heroBloks-release-crosswalk-summary-latest.json"
          cp "$work/summary.json" "$dest/release-catalog-crosswalk-summary-latest.json"
          cp "$work/crosswalk.jsonl" "$dest/heroBloks-release-crosswalk-latest.jsonl"
          cp "$work/crosswalk.jsonl" "$dest/release-catalog-crosswalk-latest.jsonl"
          cp "$work/unresolved.jsonl" "$dest/release-catalog-unresolved-latest.jsonl"
          cp "$work/collisions.jsonl" "$dest/release-catalog-collisions-latest.jsonl"
          cp "$work/downtheblocks-xinh-summary.json" "$bulk/downtheblocks-xinh-catalog-summary-latest.json"
          cp "$work/downtheblocks-xinh.jsonl" "$bulk/downtheblocks-xinh-catalog-latest.jsonl"
          for id in koruit-kdl kopf pogo wm; do
            cp "$work/downtheblocks-$id-summary.json" "$bulk/downtheblocks-$id-catalog-summary-latest.json"
            cp "$work/downtheblocks-$id.jsonl" "$bulk/downtheblocks-$id-catalog-latest.jsonl"
          done

      - name: Commit exact catalog crosswalk
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "brickmen-ingestion-bot"
          git config user.email "brickmen-ingestion-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation/*release-crosswalk-* \
                    knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation/release-catalog-unresolved-latest.jsonl \
                    knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation/release-catalog-collisions-latest.jsonl \
                    knowledge/libraries/lego-minifigure-customs/data/bulk-ingestion/downtheblocks-*-catalog-*
            if git diff --cached --quiet; then
              echo "No release crosswalk changes."
              exit 0
            fi
            git commit -m "knowledge: refresh current and historical release crosswalk"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced another ingestion commit; retrying from latest main."
          done
          exit 1
