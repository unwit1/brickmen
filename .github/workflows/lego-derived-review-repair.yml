name: LEGO Derived Review Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lego-derived-review-repair.yml'
      - 'tools/knowledge/rank_mask_headgear_candidates.py'
      - 'tools/knowledge/build_mask_headgear_candidate_corpus.py'
      - 'tools/knowledge/build_skywalker_crosswalk_review.py'
      - 'tools/knowledge/build_skywalker_physical_crosswalk_candidates.py'
      - 'tools/knowledge/skywalker_identity_keys.py'
      - 'knowledge/libraries/lego-minifigure-customs/data/bulk-ingestion/skywalker-physical-crosswalk-candidates-latest.jsonl'

permissions:
  contents: write

concurrency:
  group: lego-derived-review-repair-main
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEST: knowledge/libraries/lego-minifigure-customs/data/bulk-ingestion
      WORK: /tmp/lego-derived-review-repair

    steps:
      - name: Check out Brickmen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build minimal Rebrickable physical census
        shell: bash
        run: |
          set -euo pipefail
          raw="$WORK/rebrickable/raw"
          out="$WORK/rebrickable/output"
          mkdir -p "$raw" "$out"
          base="https://cdn.rebrickable.com/media/downloads"
          files=(themes.csv.gz colors.csv.gz parts.csv.gz part_relationships.csv.gz elements.csv.gz sets.csv.gz minifigs.csv.gz inventories.csv.gz inventory_parts.csv.gz inventory_minifigs.csv.gz)
          for file in "${files[@]}"; do
            curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 30 \
              --user-agent "BrickmenResearch/1.0" \
              --output "$raw/$file" "$base/$file"
          done
          python tools/knowledge/ingest_lego_minifigure_references.py \
            --rebrickable-dir "$raw" --output-dir "$out"


      - name: Rebuild Skywalker physical counterpart candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WORK/skywalker"
          python tools/knowledge/build_skywalker_physical_crosswalk_candidates.py \
            --skywalker-census knowledge/libraries/lego-minifigure-customs/data/skywalker-saga-profile-icon-census-2026-09-25.json \
            --physical-samples "$WORK/rebrickable/output/physical_samples.jsonl" \
            --components "$WORK/rebrickable/output/component_samples.jsonl" \
            --output "$WORK/skywalker/candidates.jsonl" \
            --summary "$WORK/skywalker/candidate-summary.json"
          cp "$WORK/skywalker/candidates.jsonl" "$DEST/skywalker-physical-crosswalk-candidates-latest.jsonl"
          cp "$WORK/skywalker/candidate-summary.json" "$DEST/skywalker-physical-crosswalk-summary-latest.json"

      - name: Rebuild Skywalker grouped review queues
        shell: bash
        run: |
          set -euo pipefail
          python tools/knowledge/build_skywalker_crosswalk_review.py \
            --candidates "$WORK/skywalker/candidates.jsonl" \
            --output "$WORK/skywalker/records.jsonl" \
            --groups-output "$WORK/skywalker/groups.jsonl" \
            --summary "$WORK/skywalker/summary.json"
          cp "$WORK/skywalker/summary.json" "$DEST/skywalker-crosswalk-review-summary-latest.json"
          cp "$WORK/skywalker/records.jsonl" "$DEST/skywalker-crosswalk-review-queue-latest.jsonl"
          cp "$WORK/skywalker/groups.jsonl" "$DEST/skywalker-crosswalk-review-groups-latest.jsonl"

      - name: Rebuild ranked mask and headgear review queue
        shell: bash
        run: |
          set -euo pipefail
          src="$WORK/mask"
          mkdir -p "$src"
          python tools/knowledge/build_mask_headgear_candidate_corpus.py \
            --samples "$WORK/rebrickable/output/physical_samples.jsonl" \
            --components "$WORK/rebrickable/output/component_samples.jsonl" \
            --output "$src/candidates.jsonl" \
            --summary "$src/candidate-summary.json"
          python tools/knowledge/rank_mask_headgear_candidates.py \
            --candidates "$src/candidates.jsonl" \
            --output "$src/ranked.jsonl" \
            --summary "$src/ranked-summary.json"
          cp "$src/ranked-summary.json" "$DEST/mask-headgear-ranked-summary-latest.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          src=Path(os.environ["WORK"])/"mask/ranked.jsonl"
          dest=Path(os.environ["DEST"])/"mask-headgear-ranked-review-top1000-latest.jsonl"
          rows=[]
          with src.open(encoding="utf-8") as f:
              for i,line in enumerate(f):
                  if i>=1000: break
                  if line.strip(): rows.append(json.loads(line))
          with dest.open("w",encoding="utf-8") as f:
              for row in rows:f.write(json.dumps(row,ensure_ascii=False)+"\n")
          PY

      - name: Commit repaired derived review outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "brickmen-ingestion-bot"
          git config user.email "brickmen-ingestion-bot@users.noreply.github.com"

          # Long rebuilds can overlap with small review-decision commits. Before
          # publishing, move onto the newest main if the generator inputs are
          # unchanged. If generator code changed, do not publish stale outputs;
          # that source change will trigger a newer repair run.
          started_at="$(git rev-parse HEAD)"
          git fetch origin main
          latest_main="$(git rev-parse origin/main)"
          relevant_inputs=(
            ".github/workflows/lego-derived-review-repair.yml"
            "tools/knowledge/build_skywalker_physical_crosswalk_candidates.py"
            "tools/knowledge/build_skywalker_crosswalk_review.py"
            "tools/knowledge/skywalker_identity_keys.py"
            "tools/knowledge/build_mask_headgear_candidate_corpus.py"
            "tools/knowledge/rank_mask_headgear_candidates.py"
            "knowledge/libraries/lego-minifigure-customs/data/skywalker-saga-profile-icon-census-2026-09-25.json"
          )
          if [[ "$started_at" != "$latest_main" ]] && \
             ! git diff --quiet "$started_at" "$latest_main" -- "${relevant_inputs[@]}"; then
            echo "Relevant generator inputs changed while this run was active; skipping stale publication."
            exit 0
          fi

          if [[ "$started_at" != "$latest_main" ]]; then
            git reset --hard "$latest_main"
            # Restore this run's deterministic generated outputs onto current main.
            cp "$WORK/skywalker/candidates.jsonl" "$DEST/skywalker-physical-crosswalk-candidates-latest.jsonl"
            cp "$WORK/skywalker/candidate-summary.json" "$DEST/skywalker-physical-crosswalk-summary-latest.json"
            cp "$WORK/skywalker/summary.json" "$DEST/skywalker-crosswalk-review-summary-latest.json"
            cp "$WORK/skywalker/records.jsonl" "$DEST/skywalker-crosswalk-review-queue-latest.jsonl"
            cp "$WORK/skywalker/groups.jsonl" "$DEST/skywalker-crosswalk-review-groups-latest.jsonl"
            cp "$WORK/mask/ranked-summary.json" "$DEST/mask-headgear-ranked-summary-latest.json"
            python - <<'PY'
          import json, os
          from pathlib import Path
          src=Path(os.environ["WORK"])/"mask/ranked.jsonl"
          dest=Path(os.environ["DEST"])/"mask-headgear-ranked-review-top1000-latest.jsonl"
          with src.open(encoding="utf-8") as inp, dest.open("w",encoding="utf-8") as out:
              for i,line in enumerate(inp):
                  if i>=1000: break
                  if line.strip():
                      out.write(json.dumps(json.loads(line),ensure_ascii=False)+"\n")
          PY
          fi

          git add "$DEST/skywalker-physical-crosswalk-candidates-latest.jsonl" \
                  "$DEST/skywalker-physical-crosswalk-summary-latest.json" \
                  "$DEST/skywalker-crosswalk-review-summary-latest.json" \
                  "$DEST/skywalker-crosswalk-review-queue-latest.jsonl" \
                  "$DEST/skywalker-crosswalk-review-groups-latest.jsonl" \
                  "$DEST/mask-headgear-ranked-summary-latest.json" \
                  "$DEST/mask-headgear-ranked-review-top1000-latest.jsonl"
          if git diff --cached --quiet; then
            echo "No derived review changes."
            exit 0
          fi
          git commit -m "knowledge: repair derived mask and Skywalker review queues"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi

            git fetch origin main
            latest_main="$(git rev-parse origin/main)"

            # If generator inputs changed since this run started, a newer
            # repair run is authoritative; do not publish stale outputs.
            if ! git diff --quiet "$started_at" "$latest_main" -- "${relevant_inputs[@]}"; then
              echo "Relevant generator inputs changed before retry; skipping stale publication."
              exit 0
            fi

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Generated-output rebase conflicted; leaving publication to a newer repair run."
              exit 0
            fi
          done
          exit 1
