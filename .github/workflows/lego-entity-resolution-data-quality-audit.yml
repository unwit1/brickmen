name: LEGO Entity Resolution Data Quality Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lego-entity-resolution-data-quality-audit.yml'
      - 'tools/knowledge/audit_entity_resolution_review.py'
      - 'knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation/entity-resolution-review-queue-latest.jsonl'

permissions:
  contents: write
concurrency:
  group: lego-entity-resolution-data-quality-audit-main
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: |
          git fetch origin main
          git reset --hard origin/main
      - run: |
          set -euo pipefail
          out=/tmp/entity-resolution-audit
          mkdir -p "$out"
          python tools/knowledge/audit_entity_resolution_review.py \
            --input knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation/entity-resolution-review-queue-latest.jsonl \
            --output "$out/records.jsonl" \
            --summary "$out/summary.json"
          dest=knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation
          cp "$out/records.jsonl" "$dest/entity-resolution-data-quality-audit-latest.jsonl"
          cp "$out/summary.json" "$dest/entity-resolution-data-quality-audit-summary-latest.json"
      - run: |
          set -euo pipefail
          git config user.name "brickmen-ingestion-bot"
          git config user.email "brickmen-ingestion-bot@users.noreply.github.com"
          git add knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation/entity-resolution-data-quality-audit-*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "knowledge: audit entity resolution data quality"
          git push origin HEAD:main
