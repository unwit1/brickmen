name: LEGO Mask Signature Propagation

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["LEGO Derived Review Repair"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/lego-mask-signature-propagation.yml'
      - 'tools/knowledge/build_mask_route_signature_propagation.py'
      - 'knowledge/libraries/lego-minifigure-customs/data/review-decisions/mask-headgear-route-review-*.json'
      - 'knowledge/libraries/lego-minifigure-customs/data/bulk-ingestion/mask-headgear-ranked-review-top1000-latest.jsonl'

permissions:
  contents: write

concurrency:
  group: lego-mask-signature-propagation-main
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Brickmen
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build signature groups and physical-route propagation
        shell: bash
        run: |
          set -euo pipefail
          data=knowledge/libraries/lego-minifigure-customs/data
          bulk="$data/bulk-ingestion"
          python tools/knowledge/build_mask_route_signature_propagation.py \
            --ranked "$bulk/mask-headgear-ranked-review-top1000-latest.jsonl" \
            --decisions-dir "$data/review-decisions" \
            --groups-output "$bulk/mask-route-signature-review-groups-latest.jsonl" \
            --propagated-output "$bulk/mask-route-signature-propagated-latest.jsonl" \
            --summary "$bulk/mask-route-signature-summary-latest.json"

      - name: Commit signature outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "brickmen-ingestion-bot"
          git config user.email "brickmen-ingestion-bot@users.noreply.github.com"
          git add knowledge/libraries/lego-minifigure-customs/data/bulk-ingestion/mask-route-signature-*
          if git diff --cached --quiet; then
            echo "No mask signature changes."
            exit 0
          fi
          git commit -m "knowledge: refresh mask route signature coverage"
          for attempt in 1 2 3 4; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
