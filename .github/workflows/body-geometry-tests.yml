name: Body geometry tests

on:
  push:
    paths:
      - "tools/geometry/**"
      - "knowledge/libraries/lego-minifigure-customs/data/skeletons/**"
      - "knowledge/libraries/lego-minifigure-customs/data/reference-landmarks/**"
      - "knowledge/libraries/lego-minifigure-customs/data/body-*.schema.json"
      - "knowledge/libraries/lego-minifigure-customs/data/ldraw-geometry-manifest.schema.json"
      - "tests/test_body_*.py"
      - "tests/test_ldraw_geometry_ingestion.py"
      - "tests/test_reference_mesh_profile.py"
      - ".github/workflows/body-geometry-tests.yml"
  pull_request:
    paths:
      - "tools/geometry/**"
      - "knowledge/libraries/lego-minifigure-customs/data/skeletons/**"
      - "knowledge/libraries/lego-minifigure-customs/data/reference-landmarks/**"
      - "knowledge/libraries/lego-minifigure-customs/data/body-*.schema.json"
      - "knowledge/libraries/lego-minifigure-customs/data/ldraw-geometry-manifest.schema.json"
      - "tests/test_body_*.py"
      - "tests/test_ldraw_geometry_ingestion.py"
      - "tests/test_reference_mesh_profile.py"
      - ".github/workflows/body-geometry-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run body geometry tests
        run: >
          python -m pytest -q
          tests/test_body_skeleton_generator.py
          tests/test_body_skeleton_fitter.py
          tests/test_body_skeleton_comparison.py
          tests/test_body_reference_envelope.py
          tests/test_body_envelope_profile_fitter.py
          tests/test_body_reference_overlay.py
          tests/test_body_generation_conditioning.py
          tests/test_body_fit_identifiability.py
          tests/test_ldraw_geometry_ingestion.py
          tests/test_reference_mesh_profile.py
