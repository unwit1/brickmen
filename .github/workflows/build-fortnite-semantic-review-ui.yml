name: Build Fortnite Semantic Review UI

on:
  workflow_dispatch:
    inputs:
      review_mode:
        description: "Review pass to prepare when batch_path is not supplied"
        required: true
        default: "first_review"
        type: choice
        options:
          - first_review
          - second_review
      batch_index:
        description: "Review batch slot (1-30, 25 records per slot); ignored when batch_path is supplied"
        required: true
        default: "1"
        type: string
      reviewer_id:
        description: "Required for second_review; must identify the independent reviewer"
        required: false
        default: "unassigned"
        type: string
      reviewer_type:
        description: "Reviewer type for a generated second-review batch"
        required: true
        default: "human"
        type: choice
        options:
          - human
          - model
          - hybrid
      batch_path:
        description: "Optional repository-relative semantic review batch JSON; overrides batch_index"
        required: false
        default: ""
        type: string
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/build-fortnite-semantic-review-ui.yml"
      - "tools/knowledge/materialize_fortnite_semantic_review_media.py"
      - "tools/knowledge/build_fortnite_semantic_review_ui.py"
      - "tools/knowledge/prepare_fortnite_semantic_second_review.py"
      - "knowledge/libraries/lego-minifigure-customs/data/semantic-review-batches/fortnite-first-review-batch-[0-9][0-9][0-9][0-9].json"
      - ".github/fortnite-semantic-review-trigger"
  push:
    paths:
      - ".github/workflows/build-fortnite-semantic-review-ui.yml"
      - "tools/knowledge/materialize_fortnite_semantic_review_media.py"
      - "tools/knowledge/build_fortnite_semantic_review_ui.py"
      - "tools/knowledge/prepare_fortnite_semantic_second_review.py"
      - "knowledge/libraries/lego-minifigure-customs/data/semantic-review-batches/fortnite-first-review-batch-[0-9][0-9][0-9][0-9].json"
      - ".github/fortnite-semantic-review-trigger"

permissions:
  contents: write

concurrency:
  group: fortnite-semantic-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-reviewer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      REVIEW_MODE: ${{ inputs.review_mode || 'first_review' }}
      BATCH_INDEX: ${{ inputs.batch_index || '1' }}
      REVIEWER_ID: ${{ inputs.reviewer_id || 'unassigned' }}
      REVIEWER_TYPE: ${{ inputs.reviewer_type || 'human' }}
      BATCH_PATH: ${{ inputs.batch_path || '' }}
      QUEUE_PATH: knowledge/libraries/lego-minifigure-customs/data/bulk-ingestion/fortnite-semantic-review-queue-latest.jsonl
    steps:
      - name: Check out Brickmen
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve or build review batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .agent-local/review-ui
          RESOLVED_BATCH_PATH="$BATCH_PATH"
          TRIGGER_REQUESTED=0
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            BATCH_INDEX="$(tr -d '[:space:]' < .github/fortnite-semantic-review-trigger)"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            CHANGED_PATHS="$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA")"
            PUSH_BATCH_PATH="$(
              printf '%s\n' "$CHANGED_PATHS" |
                python tools/knowledge/resolve_fortnite_review_batch_from_event.py --paths-stdin
            )"
            if [[ -n "$PUSH_BATCH_PATH" ]]; then
              RESOLVED_BATCH_PATH="$PUSH_BATCH_PATH"
            elif grep -Fxq ".github/fortnite-semantic-review-trigger" <<<"$CHANGED_PATHS"; then
              BATCH_INDEX="$(tr -d '[:space:]' < .github/fortnite-semantic-review-trigger)"
              TRIGGER_REQUESTED=1
            fi
          fi
          if [[ -n "$RESOLVED_BATCH_PATH" ]]; then
            case "$RESOLVED_BATCH_PATH" in
              knowledge/libraries/lego-minifigure-customs/data/semantic-review-batches/*.json) ;;
              *)
                echo "batch_path must be a JSON file under semantic-review-batches/" >&2
                exit 2
                ;;
            esac
            test -f "$RESOLVED_BATCH_PATH"
            cp "$RESOLVED_BATCH_PATH" .agent-local/review-ui/review-batch.json
          else
            if ! [[ "$BATCH_INDEX" =~ ^[0-9]+$ ]] || (( BATCH_INDEX < 1 || BATCH_INDEX > 30 )); then
              echo "batch_index must be an integer from 1 through 30" >&2
              exit 2
            fi
            OFFSET=$(( (BATCH_INDEX - 1) * 25 ))

            if [[ "$REVIEW_MODE" == "second_review" ]]; then
              REVIEW_DIR="knowledge/libraries/lego-minifigure-customs/data/semantic-review-batches"
              mapfile -t REVIEW_FILES < <(
                find "$REVIEW_DIR" -maxdepth 1 -type f -name '*-submitted.jsonl' | sort
              )
              if (( ${#REVIEW_FILES[@]} == 0 )); then
                echo "second_review requires at least one submitted review corpus" >&2
                exit 2
              fi
              REVIEW_ARGS=()
              for review_file in "${REVIEW_FILES[@]}"; do
                REVIEW_ARGS+=(--existing-reviews "$review_file")
              done
              python tools/knowledge/prepare_fortnite_semantic_second_review.py \
                --queue "$QUEUE_PATH" \
                "${REVIEW_ARGS[@]}" \
                --output .agent-local/review-ui/review-batch.json \
                --summary .agent-local/review-ui/review-batch-summary.json \
                --reviewer-id "$REVIEWER_ID" \
                --reviewer-type "$REVIEWER_TYPE" \
                --limit 25 \
                --offset "$OFFSET" \
                --min-priority-score 6
            elif [[ "$REVIEW_MODE" == "first_review" ]]; then
              CANONICAL_BATCH_PATH="$(
                printf 'knowledge/libraries/lego-minifigure-customs/data/semantic-review-batches/fortnite-first-review-batch-%04d.json' "$BATCH_INDEX"
              )"
              if [[ "$TRIGGER_REQUESTED" == "1" && -f "$CANONICAL_BATCH_PATH" ]]; then
                cp "$CANONICAL_BATCH_PATH" .agent-local/review-ui/review-batch.json
              else
                python tools/knowledge/build_fortnite_semantic_review_work_batch.py \
                  --queue "$QUEUE_PATH" \
                  --output .agent-local/review-ui/review-batch.json \
                  --summary .agent-local/review-ui/review-batch-summary.json \
                  --mode first_review \
                  --limit 25 \
                  --offset "$OFFSET" \
                  --min-priority-score 6 \
                  --reviewer-id unassigned \
                  --reviewer-type human
                if [[ "$TRIGGER_REQUESTED" == "1" ]]; then
                  cp .agent-local/review-ui/review-batch.json "$CANONICAL_BATCH_PATH"
                  git config user.name "brickmen-review-bot"
                  git config user.email "actions@users.noreply.github.com"

                  # Commit only the new deterministic batch before rebasing. Keeping
                  # derived plan/progress files out of this commit avoids stale-file
                  # conflicts when main advanced while this run was executing.
                  git add "$CANONICAL_BATCH_PATH"
                  if ! git diff --cached --quiet; then
                    git commit -m "data: materialize Fortnite semantic review batch $(printf '%04d' "$BATCH_INDEX")"
                    git pull --rebase origin main

                    # Recompute derived state against the rebased repository, then
                    # fold it into the same logical materialization commit.
                    python tools/knowledge/build_fortnite_semantic_review_batch_plan.py
                    python tools/knowledge/build_fortnite_semantic_review_progress.py
                    git add \
                      knowledge/libraries/lego-minifigure-customs/data/semantic-review-batches/fortnite-first-review-batch-plan.json \
                      knowledge/libraries/lego-minifigure-customs/data/semantic-review-batches/fortnite-semantic-review-progress.json
                    if ! git diff --cached --quiet; then
                      git commit --amend --no-edit
                    fi

                    # A non-fast-forward here is intentionally a hard failure: a
                    # later run can rebase/recompute cleanly rather than pushing
                    # derived state calculated against an obsolete main.
                    git push origin HEAD:main
                  fi
                fi
              fi
            else
              echo "review_mode must be first_review or second_review" >&2
              exit 2
            fi
          fi

      - name: Materialize exact semantic review media
        run: |
          python tools/knowledge/materialize_fortnite_semantic_review_media.py \
            --batch .agent-local/review-ui/review-batch.json \
            --output-dir .agent-local/review-ui/media \
            --output-batch .agent-local/review-ui/review-batch-materialized.json \
            --manifest .agent-local/review-ui/review-media-manifest.json

      - name: Build standalone semantic reviewer
        run: |
          python tools/knowledge/build_fortnite_semantic_review_ui.py \
            --batch .agent-local/review-ui/review-batch-materialized.json \
            --output .agent-local/review-ui/fortnite-semantic-review.html

      - name: Upload reviewer artifact
        uses: actions/upload-artifact@v4
        with:
          name: fortnite-semantic-review-ui-${{ github.run_id }}
          path: .agent-local/review-ui/
          if-no-files-found: error
          retention-days: 14
