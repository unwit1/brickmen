name: LEGO Training Data Bulk Ingestion

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lego-training-data-bulk-ingestion.yml'
      - '.github/lego-training-data-bulk-ingestion-trigger'

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OUT: /tmp/lego-training-ingestion
      DEST: knowledge/libraries/lego-minifigure-customs/data/bulk-ingestion

    steps:
      - name: Check out Agent OS
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight analysis dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Initialize output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/status" "$OUT/sources" "$DEST"
          python - <<'PY'
          import json, os, platform
          from datetime import datetime, timezone
          from pathlib import Path
          out=Path(os.environ["OUT"])
          (out/"run.json").write_text(json.dumps({
            "schema":"lego-training-bulk-ingestion-run/v1",
            "created_at":datetime.now(timezone.utc).isoformat(),
            "runner":platform.platform(),
            "python":platform.python_version()
          },indent=2))
          PY

      - name: Rebrickable physical census
        continue-on-error: true
        shell: bash
        run: |
          set +e
          src="$OUT/sources/rebrickable"; mkdir -p "$src/raw" "$src/output"
          base="https://cdn.rebrickable.com/media/downloads"
          files=(themes.csv.gz colors.csv.gz parts.csv.gz part_relationships.csv.gz elements.csv.gz sets.csv.gz minifigs.csv.gz inventories.csv.gz inventory_parts.csv.gz inventory_minifigs.csv.gz)
          ok=1
          for file in "${files[@]}"; do
            curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 30               --user-agent "PersonalAgentOS-LEGOReferenceResearch/1.0"               --output "$src/raw/$file" "$base/$file" || ok=0
          done
          if [ "$ok" = 1 ]; then
            (cd "$src/raw" && sha256sum *.csv.gz | sort > source_hashes.sha256)
            python tools/knowledge/ingest_lego_minifigure_references.py               --rebrickable-dir "$src/raw" --output-dir "$src/output"
            rc=$?
          else rc=2; fi
          RC="$rc" SRC="$src" python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          src=Path(os.environ["SRC"]);rc=int(os.environ["RC"])
          report={}
          p=src/"output/import_report.json"
          if p.exists():
              try: report=json.loads(p.read_text())
              except Exception: pass
          status={"source_id":"rebrickable_bulk","status":"complete" if rc==0 else "failed",
                  "exit_code":rc,"created_at":datetime.now(timezone.utc).isoformat(),
                  "counts":report.get("counts"),"processor_version":report.get("processor_version"),
                  "source_files":{k:{"sha256":v.get("sha256")} for k,v in (report.get("source_files") or {}).items()}}
          Path(os.environ["OUT"],"status/rebrickable.json").write_text(json.dumps(status,indent=2))
          if report:
              compact={"schema":"physical-census-snapshot/v1","created_at":report.get("created_at"),
                       "processor_version":report.get("processor_version"),"counts":report.get("counts"),
                       "optional_tables_present":report.get("optional_tables_present",[]),
                       "source_files":status["source_files"]}
              Path(os.environ["DEST"],"physical-census-latest.json").write_text(json.dumps(compact,indent=2))
          PY
          exit 0

      - name: LEGO Pick a Brick full catalog snapshot and Rebrickable crosswalk
        continue-on-error: true
        shell: bash
        run: |
          set +e
          src="$OUT/sources/pick_a_brick"; mkdir -p "$src/output"
          python tools/knowledge/snapshot_lego_pick_a_brick.py --output-dir "$src/output"
          rc=$?
          if [ "$rc" = 0 ]; then
            python tools/knowledge/crosswalk_pick_a_brick_rebrickable.py \
              --pab "$src/output/pick_a_brick_elements.jsonl" \
              --elements "$OUT/sources/rebrickable/raw/elements.csv.gz" \
              --parts "$OUT/sources/rebrickable/raw/parts.csv.gz" \
              --colors "$OUT/sources/rebrickable/raw/colors.csv.gz" \
              --components "$OUT/sources/rebrickable/output/component_samples.jsonl" \
              --output "$src/output/rebrickable_crosswalk.jsonl" \
              --summary "$src/output/crosswalk_summary.json"
            rc=$?
          fi
          RC="$rc" SRC="$src" python - <<'PY'
          import json,os,shutil
          from datetime import datetime,timezone
          from pathlib import Path
          src=Path(os.environ["SRC"]);rc=int(os.environ["RC"]);summary={};cross={}
          p=src/"output/summary.json"
          if p.exists():
              try: summary=json.loads(p.read_text())
              except Exception: pass
          q=src/"output/crosswalk_summary.json"
          if q.exists():
              try: cross=json.loads(q.read_text())
              except Exception: pass
          status={"source_id":"lego_pick_a_brick_full","status":"complete" if rc==0 else "failed",
                  "exit_code":rc,"created_at":datetime.now(timezone.utc).isoformat(),
                  "snapshot":summary,"crosswalk":cross}
          Path(os.environ["OUT"],"status/lego_pick_a_brick_full.json").write_text(json.dumps(status,indent=2))
          if rc==0:
              dest=Path(os.environ["DEST"])
              shutil.copy2(p,dest/"lego-pick-a-brick-summary-latest.json")
              shutil.copy2(q,dest/"lego-pick-a-brick-crosswalk-summary-latest.json")
              for source,name in [
                  (src/"output/pick_a_brick_elements.jsonl","lego-pick-a-brick-elements-latest.jsonl"),
                  (src/"output/rebrickable_crosswalk.jsonl","lego-pick-a-brick-crosswalk-latest.jsonl")
              ]:
                  if source.exists() and source.stat().st_size < 8_000_000:
                      shutil.copy2(source,dest/name)
          PY
          exit 0

      - name: Build quantitative theme and era profiles
        continue-on-error: true
        shell: bash
        run: |
          set +e
          src="$OUT/sources/theme_era_profiles"; mkdir -p "$src"
          python tools/knowledge/build_theme_era_profiles.py \
            --samples "$OUT/sources/rebrickable/output/physical_samples.jsonl" \
            --components "$OUT/sources/rebrickable/output/component_samples.jsonl" \
            --output "$src/profiles.jsonl" \
            --summary "$src/summary.json"
          rc=$?
          RC="$rc" SRC="$src" python - <<'PY'
          import json,os,shutil
          from datetime import datetime,timezone
          from pathlib import Path
          src=Path(os.environ["SRC"]);rc=int(os.environ["RC"]);summary={}
          p=src/"summary.json"
          if p.exists():
              try: summary=json.loads(p.read_text())
              except Exception: pass
          status={"source_id":"theme_era_profiles","status":"complete" if rc==0 else "failed",
                  "exit_code":rc,"created_at":datetime.now(timezone.utc).isoformat(),**summary}
          Path(os.environ["OUT"],"status/theme_era_profiles.json").write_text(json.dumps(status,indent=2))
          if rc==0:
              dest=Path(os.environ["DEST"])
              shutil.copy2(src/"summary.json",dest/"theme-era-profile-summary-latest.json")
              profiles=src/"profiles.jsonl"
              if profiles.exists() and profiles.stat().st_size < 8_000_000:
                  shutil.copy2(profiles,dest/"theme-era-profiles-latest.jsonl")
          PY
          exit 0

      - name: Official LDraw minifigure-pattern census
        continue-on-error: true
        shell: bash
        run: |
          set +e
          src="$OUT/sources/ldraw";mkdir -p "$src"
          url="https://library.ldraw.org/library/updates/complete.zip"
          curl --fail --location --retry 4 --retry-delay 2 --connect-timeout 30             -o "$src/complete.zip" "$url"
          rc=$?
          if [ "$rc" = 0 ]; then
            sha256sum "$src/complete.zip" > "$src/source_hash.sha256"
            unzip -q "$src/complete.zip" -d "$src/unpacked"
            root="$src/unpacked/ldraw"; [ -d "$root/parts" ] || root="$src/unpacked"
            python tools/knowledge/index_ldraw_minifig_patterns.py               --ldraw-root "$root" --output-dir "$src/output"
            rc=$?
          fi
          RC="$rc" SRC="$src" python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          src=Path(os.environ["SRC"]);rc=int(os.environ["RC"]);report={}
          p=src/"output/import_report.json"
          if p.exists():
              try: report=json.loads(p.read_text())
              except Exception: pass
          status={"source_id":"ldraw_official_library","status":"complete" if rc==0 else "failed",
                  "exit_code":rc,"created_at":datetime.now(timezone.utc).isoformat(),
                  "parts_indexed":report.get("parts_indexed"),"previews_rendered":report.get("previews_rendered"),
                  "license_counts":report.get("license_counts")}
          Path(os.environ["OUT"],"status/ldraw.json").write_text(json.dumps(status,indent=2))
          if report:
              Path(os.environ["DEST"],"ldraw-minifig-pattern-summary-latest.json").write_text(json.dumps(status,indent=2))
          PY
          exit 0

      - name: Index official LEGO source and Skywalker Saga ZIP bundles
        continue-on-error: true
        shell: bash
        run: |
          set +e
          src="$OUT/sources/official_zip_bundles"; mkdir -p "$src"
          declare -A urls
          urls[minifigure_40th]="https://www.lego.com/cdn/cs/aboutus/assets/bltc241695af5a4e401/assets.zip"
          urls[lego_games_25_year]="https://www.lego.com/cdn/cs/aboutus/assets/bltfd3ccb605641c314/LEGO_Games_Asset_Bundle.zip"
          urls[skywalker_jedi]="https://www.lego.com/cdn/cs/catalog/assets/blt814631c7161a8fbe/Jedi.zip"
          urls[skywalker_dark_side]="https://www.lego.com/cdn/cs/catalog/assets/bltd21c93a75bb1fc88/Dark_Side.zip"
          urls[skywalker_hero]="https://www.lego.com/cdn/cs/catalog/assets/blt248569e8450ae5f3/Hero.zip"
          urls[skywalker_villain]="https://www.lego.com/cdn/cs/catalog/assets/blt9a5602e35e69be8f/Villain.zip"
          urls[skywalker_scavenger]="https://www.lego.com/cdn/cs/catalog/assets/blt2eefd607fc52ab6c/Scavenger.zip"
          urls[skywalker_scoundrel]="https://www.lego.com/cdn/cs/catalog/assets/blt626c99f2400b9da9/Scoundrel.zip"
          urls[skywalker_bounty_hunter]="https://www.lego.com/cdn/cs/catalog/assets/bltf2b858555922801e/Bounty_Hunter.zip"
          urls[skywalker_astromech]="https://www.lego.com/cdn/cs/catalog/assets/blt9f0021b547d9d9f5/Astromech.zip"
          urls[skywalker_protocol]="https://www.lego.com/cdn/cs/catalog/assets/bltaefd80825ac1b1b8/Protocol.zip"
          urls[skywalker_extra]="https://www.lego.com/cdn/cs/catalog/assets/bltdf5a538c4d3523d9/Extras.zip"
          : > "$src/all-assets.jsonl"
          : > "$src/status-lines.jsonl"
          all_ok=1
          for id in minifigure_40th lego_games_25_year skywalker_jedi skywalker_dark_side skywalker_hero skywalker_villain skywalker_scavenger skywalker_scoundrel skywalker_bounty_hunter skywalker_astromech skywalker_protocol skywalker_extra; do
            dir="$src/$id"; mkdir -p "$dir"
            url="${urls[$id]}"
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 \
              --user-agent "BrickmenResearch/1.0" -o "$dir/source.zip" "$url"
            rc=$?
            if [ "$rc" = 0 ]; then
              python tools/knowledge/index_zip_bundle.py \
                --zip "$dir/source.zip" --bundle-id "$id" --source-url "$url" \
                --output "$dir/assets.jsonl" --summary "$dir/summary.json"
              rc=$?
            fi
            if [ "$rc" = 0 ]; then
              cat "$dir/assets.jsonl" >> "$src/all-assets.jsonl"
              ID="$id" DIR="$dir" python - <<'PY' >> "$src/status-lines.jsonl"
          import json,os
          from pathlib import Path
          d=Path(os.environ["DIR"])
          x=json.loads((d/"summary.json").read_text())
          print(json.dumps({"bundle_id":os.environ["ID"],**x,"index_status":x.get("status"),"status":"complete"}))
          PY
            else
              all_ok=0
              ID="$id" URL="$url" RC="$rc" python - <<'PY' >> "$src/status-lines.jsonl"
          import json,os
          print(json.dumps({"bundle_id":os.environ["ID"],"status":"failed","exit_code":int(os.environ["RC"]),"source_url":os.environ["URL"]}))
          PY
            fi
          done
          SRC="$src" python - <<'PY'
          import json,os,shutil
          from datetime import datetime,timezone
          from pathlib import Path
          src=Path(os.environ["SRC"]); rows=[]
          for line in (src/"status-lines.jsonl").read_text().splitlines():
              if line.strip(): rows.append(json.loads(line))
          status={
            "source_id":"official_lego_zip_bundles",
            "created_at":datetime.now(timezone.utc).isoformat(),
            "bundle_count":len(rows),
            "complete":sum(r.get("status")=="complete" for r in rows),
            "failed":sum(r.get("status")!="complete" for r in rows),
            "bundles":rows,
            "status":"complete" if rows and all(r.get("status")=="complete" for r in rows) else "partial"
          }
          Path(os.environ["OUT"],"status/official_lego_zip_bundles.json").write_text(json.dumps(status,indent=2))
          dest=Path(os.environ["DEST"])
          (dest/"official-lego-zip-bundle-summary-latest.json").write_text(json.dumps(status,indent=2)+"\n")
          assets=src/"all-assets.jsonl"
          if assets.exists() and assets.stat().st_size < 8_000_000:
              shutil.copy2(assets,dest/"official-lego-zip-bundle-assets-latest.jsonl")
          PY
          exit 0

      - name: Build Skywalker digital-to-physical crosswalk candidates
        continue-on-error: true
        shell: bash
        run: |
          set +e
          src="$OUT/sources/skywalker_crosswalk"; mkdir -p "$src"
          python tools/knowledge/build_skywalker_physical_crosswalk_candidates.py \
            --skywalker-census knowledge/libraries/lego-minifigure-customs/data/skywalker-saga-profile-icon-census-2026-09-25.json \
            --physical-samples "$OUT/sources/rebrickable/output/physical_samples.jsonl" \
            --output "$src/candidates.jsonl" \
            --summary "$src/summary.json"
          rc=$?
          RC="$rc" SRC="$src" python - <<'PY'
          import json,os,shutil
          from datetime import datetime,timezone
          from pathlib import Path
          src=Path(os.environ["SRC"]);rc=int(os.environ["RC"]);summary={}
          p=src/"summary.json"
          if p.exists():
              try: summary=json.loads(p.read_text())
              except Exception: pass
          status={"source_id":"skywalker_physical_crosswalk","status":"complete" if rc==0 else "failed",
                  "exit_code":rc,"created_at":datetime.now(timezone.utc).isoformat(),**summary}
          Path(os.environ["OUT"],"status/skywalker_physical_crosswalk.json").write_text(json.dumps(status,indent=2))
          if rc==0:
              dest=Path(os.environ["DEST"])
              shutil.copy2(src/"summary.json",dest/"skywalker-physical-crosswalk-summary-latest.json")
              candidates=src/"candidates.jsonl"
              if candidates.exists() and candidates.stat().st_size < 8_000_000:
                  shutil.copy2(candidates,dest/"skywalker-physical-crosswalk-candidates-latest.jsonl")
          PY
          exit 0

      - name: Vector and decal repository inventories
        continue-on-error: true
        shell: bash
        run: |
          set +e
          declare -A repos
          repos[rioforce_lego_textures]="https://github.com/rioforce/LEGO-Textures.git"
          repos[minifig_svg_decals]="https://github.com/jpgerdeman/minifig-svg-decals.git"
          repos[bricksfinder]="https://github.com/Armaggheddon/BricksFinder.git"
          all_ok=1
          for id in "${!repos[@]}"; do
            src="$OUT/sources/$id";mkdir -p "$src"
            git clone --depth 1 "${repos[$id]}" "$src/repo"
            rc=$?
            if [ "$rc" = 0 ]; then
              python tools/knowledge/inventory_training_source_tree.py --source-id "$id" --source-url "${repos[$id]}" --root "$src/repo" --output-dir "$src/output"
              rc=$?
              if [ "$rc" = 0 ] && [ "$id" = "rioforce_lego_textures" ]; then
                python tools/knowledge/index_rioforce_lego_textures.py --root "$src/repo" --output "$src/output/rioforce_semantic_index.jsonl"
                rc=$?
              fi
              if [ "$rc" = 0 ] && [ "$id" = "minifig_svg_decals" ]; then
                python tools/knowledge/index_minifig_svg_decals.py --root "$src/repo" --output "$src/output/decal_semantic_index.jsonl"
                rc=$?
              fi
            fi
            ID="$id" RC="$rc" SRC="$src" python - <<'PY'
          import json,os
          from datetime import datetime,timezone
          from pathlib import Path
          src=Path(os.environ["SRC"]);id=os.environ["ID"];rc=int(os.environ["RC"]);summary={}
          p=src/"output/source_inventory_summary.json"
          if p.exists():
              try:summary=json.loads(p.read_text())
              except Exception:pass
          status={"source_id":id,"status":"complete" if rc==0 else "failed","exit_code":rc,
                  "created_at":datetime.now(timezone.utc).isoformat(),
                  "git_commit":summary.get("git_commit"),"files":summary.get("files"),
                  "total_bytes":summary.get("total_bytes"),"asset_classes":summary.get("asset_classes"),
                  "extensions":summary.get("extensions"),"top_level_counts":summary.get("top_level_counts"),
                  "svg_files_profiled":summary.get("svg_files_profiled"),
                  "raster_files_profiled":summary.get("raster_files_profiled")}
          semantic = src/"output"/("rioforce_semantic_index.jsonl" if id=="rioforce_lego_textures" else "decal_semantic_index.jsonl")
          if semantic.exists():
              status["semantic_index_records"]=sum(1 for line in semantic.open(encoding="utf-8") if line.strip())
          Path(os.environ["OUT"],f"status/{id}.json").write_text(json.dumps(status,indent=2))
          Path(os.environ["DEST"],f"{id}-inventory-latest.json").write_text(json.dumps(status,indent=2))
          PY
            [ "$rc" = 0 ] || all_ok=0
          done
          exit 0

      - name: Profile rioforce face SVG geometry candidates
        continue-on-error: true
        shell: bash
        run: |
          set +e
          src="$OUT/sources/rioforce_face_svg"; mkdir -p "$src"
          root="$OUT/sources/rioforce_lego_textures/repo"
          python tools/knowledge/profile_rioforce_face_svgs.py \
            --root "$root" \
            --output "$src/records.jsonl" \
            --summary "$src/summary.json"
          rc=$?
          RC="$rc" SRC="$src" python - <<'PY'
          import json,os,shutil
          from datetime import datetime,timezone
          from pathlib import Path
          src=Path(os.environ["SRC"]);rc=int(os.environ["RC"]);summary={}
          p=src/"summary.json"
          if p.exists():
              try: summary=json.loads(p.read_text())
              except Exception: pass
          status={"source_id":"rioforce_face_svg","status":"complete" if rc==0 else "failed",
                  "exit_code":rc,"created_at":datetime.now(timezone.utc).isoformat(),**summary}
          Path(os.environ["OUT"],"status/rioforce_face_svg.json").write_text(json.dumps(status,indent=2))
          if rc==0:
              dest=Path(os.environ["DEST"])
              shutil.copy2(src/"summary.json",dest/"rioforce-face-svg-summary-latest.json")
              records=src/"records.jsonl"
              if records.exists() and records.stat().st_size < 8_000_000:
                  shutil.copy2(records,dest/"rioforce-face-svg-records-latest.jsonl")
          PY
          exit 0

      - name: Index LEGO face VAE training corpus
        continue-on-error: true
        shell: bash
        run: |
          set +e
          src="$OUT/sources/lego_face_vae"; mkdir -p "$src"
          git clone --depth 1 https://github.com/iechevarria/lego-face-VAE.git "$src/repo"
          rc=$?
          if [ "$rc" = 0 ]; then
            mkdir -p "$src/dataset"
            unzip -q "$src/repo/dataset.zip" -d "$src/dataset"
            rc=$?
          fi
          if [ "$rc" = 0 ]; then
            python tools/knowledge/index_lego_face_vae_dataset.py \
              --root "$src/dataset" \
              --heads-csv "$src/repo/dataset_scripts/minifig-heads.csv" \
              --output "$src/records.jsonl" \
              --summary "$src/summary.json"
            rc=$?
          fi
          RC="$rc" SRC="$src" python - <<'PY'
          import json,os,shutil,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          src=Path(os.environ["SRC"]);rc=int(os.environ["RC"]);summary={};commit=None
          p=src/"summary.json"
          if p.exists():
              try: summary=json.loads(p.read_text())
              except Exception: pass
          if (src/"repo/.git").exists():
              try: commit=subprocess.check_output(["git","-C",str(src/"repo"),"rev-parse","HEAD"],text=True).strip()
              except Exception: pass
          status={"source_id":"lego_face_vae","status":"complete" if rc==0 else "failed",
                  "exit_code":rc,"created_at":datetime.now(timezone.utc).isoformat(),
                  "source_commit":commit,**summary}
          Path(os.environ["OUT"],"status/lego_face_vae.json").write_text(json.dumps(status,indent=2))
          if rc==0:
              dest=Path(os.environ["DEST"])
              shutil.copy2(src/"summary.json",dest/"lego-face-vae-summary-latest.json")
              records=src/"records.jsonl"
              if records.exists() and records.stat().st_size < 8_000_000:
                  shutil.copy2(records,dest/"lego-face-vae-records-latest.jsonl")
          PY
          exit 0

      - name: Build face landmark review queue
        continue-on-error: true
        shell: bash
        run: |
          set +e
          src="$OUT/sources/rioforce_face_svg"
          python tools/knowledge/build_face_landmark_review_queue.py \
            --profiles "$src/records.jsonl" \
            --output "$src/review-queue.jsonl" \
            --summary "$src/review-summary.json"
          rc=$?
          RC="$rc" SRC="$src" python - <<'PY'
          import json,os,shutil
          from datetime import datetime,timezone
          from pathlib import Path
          src=Path(os.environ["SRC"]);rc=int(os.environ["RC"]);summary={}
          p=src/"review-summary.json"
          if p.exists():
              try: summary=json.loads(p.read_text())
              except Exception: pass
          status={"source_id":"rioforce_face_review_queue","status":"complete" if rc==0 else "failed",
                  "exit_code":rc,"created_at":datetime.now(timezone.utc).isoformat(),**summary}
          Path(os.environ["OUT"],"status/rioforce_face_review_queue.json").write_text(json.dumps(status,indent=2))
          if rc==0:
              dest=Path(os.environ["DEST"])
              shutil.copy2(src/"review-summary.json",dest/"face-landmark-review-summary-latest.json")
              q=src/"review-queue.jsonl"
              if q.exists() and q.stat().st_size < 8_000_000:
                  shutil.copy2(q,dest/"face-landmark-review-queue-latest.jsonl")
          PY
          exit 0

      - name: Build flat-art crosswalk candidates
        continue-on-error: true
        shell: bash
        run: |
          set +e
          src="$OUT/sources/flat_art_crosswalk"; mkdir -p "$src"
          rio="$OUT/sources/rioforce_lego_textures/output/rioforce_semantic_index.jsonl"
          ldraw="$OUT/sources/ldraw/output/ldraw_minifig_patterns.jsonl"
          python tools/knowledge/build_flat_art_crosswalk_candidates.py \
            --rioforce-index "$rio" \
            --ldraw-index "$ldraw" \
