      - name: Fortnite LEGO Style TranslationPair census
        continue-on-error: true
        shell: bash
        run: |
          set +e
          src="$OUT/sources/fortnite";mkdir -p "$src"
          git clone --depth 1 https://github.com/Fortnite-Datamining/Fortnite-Datamining.git "$src/repo"
          rc=$?
          if [ "$rc" = 0 ]; then
            br="$src/repo/data/cosmetics/br.json"
            lego="$src/repo/data/cosmetics/lego.json"
            python tools/knowledge/build_fortnite_lego_translation_pairs.py               --br "$br" --lego "$lego" --output-dir "$src/output"
            rc=$?
          fi
          RC="$rc" SRC="$src" python - <<'PY'
          import json,os,subprocess,shutil
          from datetime import datetime,timezone
          from pathlib import Path
          src=Path(os.environ["SRC"]);rc=int(os.environ["RC"]);summary={};commit=None
          if (src/"repo/.git").exists():
              try:commit=subprocess.check_output(["git","-C",str(src/"repo"),"rev-parse","HEAD"],text=True).strip()
              except Exception:pass
          p=src/"output/summary.json"
          if p.exists():
              try:summary=json.loads(p.read_text())
              except Exception:pass
          status={"source_id":"fortnite_lego_styles","status":"complete" if rc==0 else "failed","exit_code":rc,
                  "created_at":datetime.now(timezone.utc).isoformat(),"source_commit":commit,**summary}
          Path(os.environ["OUT"],"status/fortnite.json").write_text(json.dumps(status,indent=2))
          Path(os.environ["DEST"],"fortnite-lego-translation-summary-latest.json").write_text(json.dumps(status,indent=2))
          pair=src/"output/fortnite_lego_translation_pairs.jsonl"
          if pair.exists() and pair.stat().st_size < 8_000_000:
              shutil.copy2(pair,Path(os.environ["DEST"])/"fortnite-lego-translation-pairs-latest.jsonl")
          queue=src/"output/fortnite_lego_semantic_annotation_queue.jsonl"
          if queue.exists():
              dest=Path(os.environ["DEST"])
              for old in dest.glob("fortnite-lego-semantic-annotation-queue-part-*.jsonl"):
                  old.unlink()
              lines=[line for line in queue.read_text(encoding="utf-8").splitlines() if line.strip()]
              shard_size=250
              shard_names=[]
              for start in range(0,len(lines),shard_size):
                  index=start//shard_size+1
                  name=f"fortnite-lego-semantic-annotation-queue-part-{index:02d}.jsonl"
                  (dest/name).write_text("\n".join(lines[start:start+shard_size])+"\n",encoding="utf-8")
                  shard_names.append(name)
              manifest={
                  "schema":"fortnite-lego-semantic-annotation-queue-manifest/v1",
                  "records":len(lines),
                  "shard_size":shard_size,
                  "shard_count":len(shard_names),
                  "shards":shard_names,
                  "processor_version":summary.get("processor_version")
              }
              (dest/"fortnite-lego-semantic-annotation-queue-manifest-latest.json").write_text(
                  json.dumps(manifest,indent=2)+"\n",encoding="utf-8"
              )
          PY
          exit 0

