name: Materialize Architecture Segmentation Sources

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/materialize-body-architecture-segmentation-sources.yml'
      - 'tools/knowledge/materialize_body_architecture_exact_review_media.py'
      - 'knowledge/libraries/lego-minifigure-customs/data/body-architecture-benchmark-segmentation-prompts.json'
      - 'knowledge/libraries/lego-minifigure-customs/data/body-architecture-recognition-benchmark-cases.json'

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Brickmen
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize exact segmentation source media
        run: |
          python tools/knowledge/materialize_body_architecture_exact_review_media.py \
            --benchmark knowledge/libraries/lego-minifigure-customs/data/body-architecture-recognition-benchmark-cases.json \
            --source-record-id hulk_alpha_af344_avengers \
            --source-record-id hulk_alpha_af345_comics \
            --source-record-id hulk_mrj_heart_comics \
            --source-record-id red_hulk_alpha_af364_bnw \
            --source-record-id thing_shengyuan_sy288_bigfig \
            --source-record-id thing_tp_tp349_first_steps_bigfig \
            --source-record-id venom_alpha_af325 \
            --source-record-id venom_alpha_af328_ancient \
            --source-record-id venom_xinh_xh1829_movie_bigfig \
            --source-record-id venom_xinh_xh1911_bigfig \
            --output-dir .agent-local/body-architecture-segmentation-sources \
            --report .agent-local/body-architecture-segmentation-sources-report.json \
            --allow-host static.herobloks.com \
            --allow-host kongbricks.com \
            --allow-host kongbricks.myshopify.com \
            --allow-host cdn.shopify.com \
            --timeout-seconds 30
      - name: Upload short-lived source review bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: body-architecture-segmentation-source-review
          path: |
            .agent-local/body-architecture-segmentation-sources
            .agent-local/body-architecture-segmentation-sources-report.json
          if-no-files-found: warn
          retention-days: 3
