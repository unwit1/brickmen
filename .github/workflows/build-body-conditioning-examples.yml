name: Build body generation conditioning examples

on:
  push:
    paths:
      - ".github/workflows/build-body-conditioning-examples.yml"
      - "tools/geometry/compile_body_generation_conditioning.py"
      - "tools/geometry/fit_body_skeleton.py"
      - "tools/geometry/fit_body_envelope_profile.py"
      - "tools/geometry/generate_body_skeleton.py"
      - "knowledge/libraries/lego-minifigure-customs/data/body-generation-provider-registry.json"
      - "tools/geometry/compile_body_generation_provider_job.py"
      - "tools/geometry/compile_body_articulation_sweeps.py"
      - "tools/geometry/render_body_generation_guides.py"
      - "tools/geometry/summarize_body_generation_pipeline_state.py"
      - "knowledge/libraries/lego-minifigure-customs/data/skeletons/brickmen-giant-v0.json"
      - "knowledge/libraries/lego-minifigure-customs/data/skeletons/brickmen-broad-v0.json"
      - "knowledge/libraries/lego-minifigure-customs/data/reference-landmarks/lego-giant-ldraw-shoulders-fit.json"
      - "knowledge/libraries/lego-minifigure-customs/data/reference-landmarks/lego-giant-10128-ldraw-body-profile.json"
      - "knowledge/libraries/lego-minifigure-customs/data/reference-landmarks/lego-giant-limb-ldraw-envelope-profile.json"
      - "knowledge/libraries/lego-minifigure-customs/data/reference-landmarks/lego-axl-front.json"
      - "knowledge/libraries/lego-minifigure-customs/data/joint-profiles/lego-giant-43093-shoulder-reference-v0.json"
  workflow_dispatch:

concurrency:
  group: brickmen-body-conditioning-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compile canonical conditioning examples
        run: |
          set -euo pipefail
          OUT="knowledge/libraries/lego-minifigure-customs/data/generation-conditioning"
          mkdir -p "$OUT"

          python -m tools.geometry.compile_body_generation_conditioning \
            knowledge/libraries/lego-minifigure-customs/data/skeletons/brickmen-giant-v0.json \
            --skeleton-reference knowledge/libraries/lego-minifigure-customs/data/reference-landmarks/lego-giant-ldraw-shoulders-fit.json \
            --envelope-reference knowledge/libraries/lego-minifigure-customs/data/reference-landmarks/lego-giant-10128-ldraw-body-profile.json \
            --envelope-reference knowledge/libraries/lego-minifigure-customs/data/reference-landmarks/lego-giant-limb-ldraw-envelope-profile.json \
            --joint-profile knowledge/libraries/lego-minifigure-customs/data/joint-profiles/lego-giant-43093-shoulder-reference-v0.json \
            -o "$OUT/brickmen-giant-official-cad-v0.json"

          python -m tools.geometry.compile_body_generation_conditioning \
            knowledge/libraries/lego-minifigure-customs/data/skeletons/brickmen-broad-v0.json \
            --envelope-reference knowledge/libraries/lego-minifigure-customs/data/reference-landmarks/lego-axl-front.json \
            -o "$OUT/brickmen-broad-axl-envelope-v0.json"

      - name: Compile articulation and provider fixtures
        run: |
          set -euo pipefail
          CONDITIONING="knowledge/libraries/lego-minifigure-customs/data/generation-conditioning/brickmen-giant-official-cad-v0.json"
          REGISTRY="knowledge/libraries/lego-minifigure-customs/data/body-generation-provider-registry.json"
          SWEEPS="knowledge/libraries/lego-minifigure-customs/data/articulation-sweeps"
          GUIDES="knowledge/libraries/lego-minifigure-customs/data/generation-guides/brickmen-giant-official-cad-v0"
          JOBS="knowledge/libraries/lego-minifigure-customs/data/provider-jobs/brickmen-giant-official-cad-v0"
          STATES="knowledge/libraries/lego-minifigure-customs/data/pipeline-state/brickmen-giant-official-cad-v0"
          mkdir -p "$SWEEPS" "$GUIDES" "$JOBS" "$STATES"

          python -m tools.geometry.compile_body_articulation_sweeps \
            "$CONDITIONING" \
            -o "$SWEEPS/brickmen-giant-official-cad-v0.json"

          python -m tools.geometry.render_body_generation_guides \
            "$CONDITIONING" "$GUIDES" \
            --sweeps "$SWEEPS/brickmen-giant-official-cad-v0.json"

          for provider in partcrafter partpacker pact particulate sam_3d_objects; do
            python -m tools.geometry.compile_body_generation_provider_job \
              "$CONDITIONING" "$REGISTRY" "$provider" \
              --guide-manifest "$GUIDES/manifest.json" \
              --sweeps "$SWEEPS/brickmen-giant-official-cad-v0.json" \
              -o "$JOBS/$provider.json"

            python -m tools.geometry.summarize_body_generation_pipeline_state \
              "$CONDITIONING" \
              --sweeps "$SWEEPS/brickmen-giant-official-cad-v0.json" \
              --guide-manifest "$GUIDES/manifest.json" \
              --provider-job "$JOBS/$provider.json" \
              -o "$STATES/$provider.json"
          done

      - name: Validate example invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = Path("knowledge/libraries/lego-minifigure-customs/data/generation-conditioning")
          giant = json.loads((base / "brickmen-giant-official-cad-v0.json").read_text())
          axl = json.loads((base / "brickmen-broad-axl-envelope-v0.json").read_text())

          assert giant["production_geometry_authority"] is False
          assert giant["target_height_mm"] == 62
          assert len(giant["source_fits"]["envelope_reference_ids"]) == 2
          assert giant["mechanical_constraints"][0]["manufacturing_authority"] is False
          assert giant["mechanical_constraints"][0]["reference_keepout_bbox_mm"] == [16, 6.4, 6.4]

          envelopes = {x["envelope_id"]: x for x in giant["visual_envelopes"]}
          torso = envelopes["torso"]
          arm = envelopes["arm_l"]
          hand = envelopes["hand_l"]
          lower = envelopes["lower_body"]

          assert abs(torso["size_normalized_body_height"][0] - 0.44822387062555535) < 1e-6
          assert abs(torso["size_normalized_body_height"][1] - 0.41732606682059015) < 1e-6
          assert abs(arm["size_normalized_body_height"][0] - 0.181781764684078) < 1e-6
          assert abs(arm["size_normalized_body_height"][1] - 0.27980484946128936) < 1e-6
          assert abs(hand["size_normalized_body_height"][0] - 0.17426889310845864) < 1e-6
          assert abs(lower["size_normalized_body_height"][0] - 0.5650024325259488) < 1e-6
          assert abs(lower["size_normalized_body_height"][1] - 0.32817198428195515) < 1e-6
          assert arm["a_node"] == "shoulder_l"
          assert arm["b_node"] == "wrist_l"

          assert axl["production_geometry_authority"] is False
          assert abs(axl["skeleton_control"]["nodes"]["shoulder_l"]["position_normalized_body_height"][0] + 0.185) < 1e-9
          axl_torso = next(x for x in axl["visual_envelopes"] if x["envelope_id"] == "torso")
          assert axl_torso["size_normalized_body_height"][0] > 0.67

          sweep = json.loads(
              Path("knowledge/libraries/lego-minifigure-customs/data/articulation-sweeps/brickmen-giant-official-cad-v0.json").read_text()
          )
          shoulder = next(x for x in sweep["joint_sweeps"] if x["joint_id"] == "shoulder_l")
          assert shoulder["mechanical_placements_at_pivot"]
          assert shoulder["combined_swept_aabb_normalized_body_height"]["min"][1] < 0
          assert shoulder["combined_swept_aabb_normalized_body_height"]["max"][1] > 0
          assert sweep["production_geometry_authority"] is False

          guide_base = Path("knowledge/libraries/lego-minifigure-customs/data/generation-guides/brickmen-giant-official-cad-v0")
          guide_manifest = json.loads((guide_base / "manifest.json").read_text())
          assert guide_manifest["source_image_embedded"] is False
          assert guide_manifest["has_articulation_sweeps"] is True
          assert (guide_base / "front.svg").exists()
          assert (guide_base / "side.svg").exists()

          job_base = Path("knowledge/libraries/lego-minifigure-customs/data/provider-jobs/brickmen-giant-official-cad-v0")
          partcrafter = json.loads((job_base / "partcrafter.json").read_text())
          assert partcrafter["native_arguments"]["num_parts"] == 7
          assert len(partcrafter["component_slots"]["required"]) == 7
          assert partcrafter["guide_pack"]["source_image_embedded"] is False
          assert "shoulder_l" in partcrafter["articulation_sweep_summary"]["joint_ids"]
          assert partcrafter["production_geometry_authority"] is False
          particulate = json.loads((job_base / "particulate.json").read_text())
          assert particulate["provider_role"] == "mesh_to_articulation_inference_critic"
          assert partcrafter["execution_interface"]["adapter_status"] == "runnable_cli_verified"

          state_base = Path("knowledge/libraries/lego-minifigure-customs/data/pipeline-state/brickmen-giant-official-cad-v0")
          partcrafter_state = json.loads((state_base / "partcrafter.json").read_text())
          sam_state = json.loads((state_base / "sam_3d_objects.json").read_text())
          assert next(
              g for g in partcrafter_state["gates"] if g["gate_id"] == "provider_run"
          )["status"] == "pending"
          assert next(
              g for g in sam_state["gates"] if g["gate_id"] == "provider_run"
          )["status"] == "blocked"
          assert "mechanical_interface_validation" in partcrafter_state["production_readiness"]["blocking_gates"]
          print("conditioning, sweep, provider and pipeline-state fixtures validated")
          PY

      - name: Commit conditioning examples
        run: |
          set -euo pipefail
          git config user.name "brickmen-conditioning-bot"
          git config user.email "130810487+unwit1@users.noreply.github.com"
          git add \
            knowledge/libraries/lego-minifigure-customs/data/generation-conditioning \
            knowledge/libraries/lego-minifigure-customs/data/articulation-sweeps \
            knowledge/libraries/lego-minifigure-customs/data/generation-guides \
            knowledge/libraries/lego-minifigure-customs/data/provider-jobs \
            knowledge/libraries/lego-minifigure-customs/data/pipeline-state
          if git diff --cached --quiet; then
            echo "No conditioning example changes."
            exit 0
          fi
          git commit -m "data: update canonical body generation conditioning examples"
          git pull --rebase origin main
          git push origin HEAD:main
