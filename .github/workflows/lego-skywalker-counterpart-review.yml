name: LEGO Skywalker Counterpart Review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lego-skywalker-counterpart-review.yml'
      - 'tools/knowledge/classify_skywalker_counterparts.py'
      - 'tools/knowledge/classify_skywalker_identity_families.py'
      - 'tools/knowledge/summarize_skywalker_unresolved.py'
      - 'tools/knowledge/summarize_skywalker_manual_reviews.py'
      - 'tools/knowledge/skywalker_identity_keys.py'
      - 'knowledge/libraries/lego-minifigure-customs/data/bulk-ingestion/skywalker-physical-crosswalk-candidates-latest.jsonl'
      - 'knowledge/libraries/lego-minifigure-customs/data/review-decisions/skywalker-*.json'

permissions:
  contents: write

concurrency:
  group: lego-skywalker-counterpart-review-main
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Brickmen
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Classify counterpart evidence
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/skywalker-counterparts
          mkdir -p "$work"
          python tools/knowledge/classify_skywalker_counterparts.py \
            --candidates knowledge/libraries/lego-minifigure-customs/data/bulk-ingestion/skywalker-physical-crosswalk-candidates-latest.jsonl \
            --output "$work/records.jsonl" \
            --unresolved-output "$work/unresolved.jsonl" \
            --summary "$work/summary.json"

      - name: Classify digital identity families
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/skywalker-counterparts
          python tools/knowledge/classify_skywalker_identity_families.py \
            --candidates knowledge/libraries/lego-minifigure-customs/data/bulk-ingestion/skywalker-physical-crosswalk-candidates-latest.jsonl \
            --output "$work/identity-families.jsonl" \
            --summary "$work/identity-family-summary.json"

      - name: Summarize unresolved cohorts
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/skywalker-counterparts
          python tools/knowledge/summarize_skywalker_unresolved.py \
            --records "$work/unresolved.jsonl" \
            --summary "$work/unresolved-summary.json" \
            --top-output "$work/unresolved-top.jsonl"

      - name: Compile manual review coverage
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/skywalker-counterparts
          python tools/knowledge/summarize_skywalker_manual_reviews.py \
            --review-dir knowledge/libraries/lego-minifigure-customs/data/review-decisions \
            --identity-families "$work/identity-families.jsonl" \
            --output "$work/manual-unreviewed.jsonl" \
            --summary "$work/manual-review-summary.json"

      - name: Commit review snapshots race-safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "brickmen-ingestion-bot"
          git config user.email "brickmen-ingestion-bot@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          work=/tmp/skywalker-counterparts
          dest=knowledge/libraries/lego-minifigure-customs/data/bulk-ingestion
          cp "$work/records.jsonl" "$dest/skywalker-counterpart-classification-latest.jsonl"
          cp "$work/unresolved.jsonl" "$dest/skywalker-counterpart-unresolved-latest.jsonl"
          cp "$work/summary.json" "$dest/skywalker-counterpart-classification-summary-latest.json"
          cp "$work/unresolved-summary.json" "$dest/skywalker-counterpart-unresolved-summary-latest.json"
          cp "$work/identity-families.jsonl" "$dest/skywalker-identity-families-latest.jsonl"
          cp "$work/identity-family-summary.json" "$dest/skywalker-identity-family-summary-latest.json"
          cp "$work/unresolved-top.jsonl" "$dest/skywalker-counterpart-unresolved-top-latest.jsonl"
          cp "$work/manual-unreviewed.jsonl" "$dest/skywalker-manual-review-unreviewed-latest.jsonl"
          cp "$work/manual-review-summary.json" "$dest/skywalker-manual-review-summary-latest.json"
          git add "$dest/skywalker-counterpart-classification-latest.jsonl" "$dest/skywalker-counterpart-unresolved-latest.jsonl" "$dest/skywalker-counterpart-classification-summary-latest.json" "$dest/skywalker-counterpart-unresolved-summary-latest.json" "$dest/skywalker-counterpart-unresolved-top-latest.jsonl" "$dest/skywalker-identity-families-latest.jsonl" "$dest/skywalker-identity-family-summary-latest.json" "$dest/skywalker-manual-review-unreviewed-latest.jsonl" "$dest/skywalker-manual-review-summary-latest.json"
          if git diff --cached --quiet; then
            echo "No Skywalker counterpart changes."
            exit 0
          fi
          git commit -m "knowledge: refresh Skywalker counterpart classification"
          git push origin main
