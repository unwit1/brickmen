name: LEGO Official Wishlist BrickLink Metadata

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lego-official-wishlist-bricklink.yml'
      - 'tools/knowledge/resolve_bricklink_public_minifigure_metadata.py'
      - 'knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation/external-catalog-id-queue-latest.jsonl'

permissions:
  contents: write

concurrency:
  group: lego-official-wishlist-bricklink-main
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync latest main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Resolve public BrickLink metadata
        run: |
          set -euo pipefail
          out=/tmp/bricklink-wishlist
          mkdir -p "$out"
          python tools/knowledge/resolve_bricklink_public_minifigure_metadata.py \
            --queue knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation/external-catalog-id-queue-latest.jsonl \
            --output "$out/records.jsonl" \
            --summary "$out/summary.json" \
            --delay-seconds 0.2
          dest=knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation
          cp "$out/records.jsonl" "$dest/official-wishlist-bricklink-metadata-latest.jsonl"
          cp "$out/summary.json" "$dest/official-wishlist-bricklink-metadata-summary-latest.json"
      - name: Commit metadata snapshot
        run: |
          set -euo pipefail
          git config user.name "brickmen-ingestion-bot"
          git config user.email "brickmen-ingestion-bot@users.noreply.github.com"
          git add knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation/official-wishlist-bricklink-metadata-*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "knowledge: refresh official wishlist BrickLink metadata"
          git push origin HEAD:main
