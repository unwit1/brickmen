name: LEGO Tracker Identity Field Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lego-tracker-identity-field-audit.yml'
      - 'tools/knowledge/audit_tracker_identity_fields.py'
      - 'knowledge/libraries/lego-minifigure-customs/data/user-collection/**'
      - 'knowledge/libraries/lego-minifigure-customs/data/user-design-targets/**'
      - 'knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation/user-tracker-semantic-corrections-2026-09-26.json'

permissions:
  contents: write

concurrency:
  group: lego-tracker-identity-field-audit-main
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          git fetch origin main
          git reset --hard origin/main
      - run: |
          set -euo pipefail
          out=/tmp/tracker-identity-field-audit
          mkdir -p "$out"
          python tools/knowledge/audit_tracker_identity_fields.py \
            --collection-dir knowledge/libraries/lego-minifigure-customs/data/user-collection \
            --design-dir knowledge/libraries/lego-minifigure-customs/data/user-design-targets \
            --semantic-corrections knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation/user-tracker-semantic-corrections-2026-09-26.json \
            --output "$out/records.jsonl" \
            --summary "$out/summary.json"
          dest=knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation
          cp "$out/records.jsonl" "$dest/tracker-identity-field-review-latest.jsonl"
          cp "$out/summary.json" "$dest/tracker-identity-field-review-summary-latest.json"
      - run: |
          set -euo pipefail
          git config user.name "brickmen-ingestion-bot"
          git config user.email "brickmen-ingestion-bot@users.noreply.github.com"
          git add knowledge/libraries/lego-minifigure-customs/data/user-entity-reconciliation/tracker-identity-field-review-*
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "knowledge: audit tracker identity field semantics"
          git push origin HEAD:main
