name: LEGO Mask Topology Classification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lego-mask-topology-classification.yml'
      - 'tools/knowledge/classify_mask_route_topologies.py'
      - 'knowledge/libraries/lego-minifigure-customs/data/bulk-ingestion/mask-headgear-ranked-review-top1000-latest.jsonl'

permissions:
  contents: write

concurrency:
  group: lego-mask-topology-classification-main
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out Brickmen
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Classify physical topology
        shell: bash
        run: |
          set -euo pipefail
          bulk=knowledge/libraries/lego-minifigure-customs/data/bulk-ingestion
          python tools/knowledge/classify_mask_route_topologies.py \
            --ranked "$bulk/mask-headgear-ranked-review-top1000-latest.jsonl" \
            --output "$bulk/mask-route-topology-classification-latest.jsonl" \
            --summary "$bulk/mask-route-topology-classification-summary-latest.json"

      - name: Commit topology outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "brickmen-ingestion-bot"
          git config user.email "brickmen-ingestion-bot@users.noreply.github.com"
          git add knowledge/libraries/lego-minifigure-customs/data/bulk-ingestion/mask-route-topology-classification-*
          if git diff --cached --quiet; then
            echo "No topology classification changes."
            exit 0
          fi
          git commit -m "knowledge: refresh mask topology classification"
          for attempt in 1 2 3 4; do
            if git push; then exit 0; fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Topology output rebase conflicted; a newer run will regenerate."
              exit 0
            fi
          done
          exit 1
